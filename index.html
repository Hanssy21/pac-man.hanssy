<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pac-Man by HANSSY ROY</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="juego">

        <h1>🟡 PAC-MAN by HANSSY ROY </h1>

        <div class="contenedor-canvas">

            <canvas
                id="game"
                width="560"
                height="392"
            ></canvas>

        </div>

        <p class="instrucciones">
            Usa las flechas del teclado para mover a Pac-Man
        </p>

    </div>

    <audio
        id="bgMusic"
        loop
    >
        <source
            src="musica.mp3"
            type="audio/mpeg"
        >

        Tu navegador no soporta audio.
    </audio>

    <script src="script.js"></script>

</body>
</html>
